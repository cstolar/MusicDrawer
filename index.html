<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#f6f4f1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Music Drawer</title>
  <link rel="stylesheet" href="style.css?v=0.2.1">
</head>
<body>
  <main id="app">
    <div id="stage">
      <canvas id="canvas"></canvas>
      <div id="toast"></div>
      <div id="linkPanel" hidden>
        <input id="linkInput" readonly aria-label="Link zur Zeichnung">
        <button id="linkCopy" class="btn small" aria-label="Kopieren">⧉</button>
        <button id="linkClose" class="btn small" aria-label="Schließen">✕</button>
      </div>
      <div id="hint">Male eine Linie – der Strich wird zur Melodie</div>
    </div>

    <div id="controls">
      <div class="row">
        <button id="play" class="btn" aria-label="Play/Pause">▶</button>
        <button id="undo" class="btn" aria-label="Rückgängig">↺</button>
        <button id="clear" class="btn" aria-label="Alles löschen">✕</button>
        <button id="share" class="btn" aria-label="Teilen"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3"/><path d="m7 8 5-5 5 5"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg></button>
        <div class="spacer"></div>
        <div class="tempo">
          <button id="slower" class="btn small" aria-label="Langsamer">−</button>
          <span id="bpm">90</span>
          <button id="faster" class="btn small" aria-label="Schneller">+</button>
        </div>
      </div>
      <div id="palette" class="row palette"></div>
      <div id="info">
        <strong id="instName"></strong>
        <span id="instFx"></span>
      </div>
    </div>
    <footer id="version">Music Drawer</footer>
  </main>
  <script src="app.js?v=0.2.1"></script>
</body>
</html>
